name: Deploy CDK When Lambda Updates

on:
  repository_dispatch:
    types: [lambda-updated]

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CDK repo (with submodule)
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0  # required for full git history and submodule updates

      - name: Configure submodule to track main branch
        run: |
          git config -f .gitmodules submodule.lambdas.branch main
          git submodule sync
          git submodule update --remote --merge

      - name: Commit updated submodule reference (optional)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add lambdas
          if git diff --cached --quiet; then
            echo "No submodule updates to commit."
          else
            git commit -m "Update submodule to latest main"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::026090533592:role/GitHubActionsDeployRole
          aws-region: us-west-1

      - name: CDK Bootstrap (optional)
        run: npx cdk bootstrap

      - name: Deploy CDK stack
        run: npx cdk deploy --require-approval never
